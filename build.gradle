buildscript {
    dependencies {
//        classpath 'org.yaml:snakeyaml:1.33'
    }
}

plugins {
    id 'java'
}

subprojects {
    group = 'io.joyoungc'
    version = '0.0.1-SNAPSHOT'

    apply plugin: 'java-library'

    sourceCompatibility = '21'
    targetCompatibility = '21'

    ext {
        springBootVersion = '3.5.16'
        springDependencyManagementVersion = '1.1.7'
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        testImplementation platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"

        // lombok
        implementation 'org.projectlombok:lombok:1.18.32'
        annotationProcessor 'org.projectlombok:lombok:1.18.32'
        testAnnotationProcessor "org.projectlombok:lombok:1.18.32"

        // commons
        implementation 'org.apache.commons:commons-lang3:3.14.0'
        implementation 'org.apache.commons:commons-collections4:4.4'
    }

    test {
        useJUnitPlatform()

        testLogging {
//            showStandardStreams = true // Print standard out and standard error to the console.
        }

        afterSuite { desc, result ->
            if (!desc.parent) { // will match the outermost suite
                def output = "Test Results: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped)"
                def startItem = '|  ', endItem = '  |'
                def repeatLength = startItem.length() + output.length() + endItem.length()
                println('\n' + ('-' * repeatLength) + '\n' + startItem + output + endItem + '\n' + ('-' * repeatLength) + '\n')
            }
        }
    }

}