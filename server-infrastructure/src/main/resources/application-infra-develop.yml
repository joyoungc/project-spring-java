# 스프링 프레임워크 설정
spring:
  output:
    ansi:
      enabled: always
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: app
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    hibernate:
      ddl-auto: none
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration, org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration, org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
  sql:
    init:
      schema-locations:
        - classpath:/sql/schema.sql
      encoding: UTF-8
      mode: embedded
      data-locations:
        - classpath:/sql/common-data.sql

client:
  http-api:
    endpoint: https://www.boredapi.com
    connection-timeout: 5
    read-timeout: 5

decorator:
  datasource:
    p6spy:
      multiline: true
