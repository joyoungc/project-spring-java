version: '3.1'
services:
  db:
    container_name: local-mysql
    image: mysql:8.0.38
    restart: always
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app-db
      MYSQL_USER: user
      MYSQL_PASSWORD: user
      TZ: Asia/Seoul
    volumes:
      - '/Users/joyoung/Data/mysql:/var/lib/mysql'
    command:
      - '--character-set-server=utf8mb4'
      - '--collation-server=utf8mb4_unicode_ci'